# SupaTheme integration for the minimal tmux status bar.
# This file is copied to ~/.config/tmux/theme.conf by theme-sync.
set -g @minimal_theme_bg_color "#060606"
set -g @minimal_theme_active_color "#75a1c7"
set -g @minimal_theme_inactive_color "#888888"
set -g @minimal_theme_text_color "#e4e4e8"
set -g @minimal_theme_accent_color "#c4a8d6"
set -g @minimal_theme_border_color "#404040"
